<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="473302958295-dummy.apps.googleusercontent.com">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7kBY4q9yTC5yhwlkrqViy_8p_LBF_MgA"></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="safekid_transport_assistant">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>safekid_transport_assistant</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- reCAPTCHA v2 for Firebase Phone Authentication on Web -->
  <script src="https://www.google.com/recaptcha/api.js"></script>
  <script>
    // Initialize reCAPTCHA when the page loads
    window.recaptchaVerifier = null;
    
    // Listen for the Flutter app to be ready, then initialize reCAPTCHA
    window.addEventListener('flutter-first-frame', () => {
      if (!window.recaptchaVerifier) {
        try {
          // Create a hidden reCAPTCHA container for Firebase
          const container = document.createElement('div');
          container.id = 'recaptcha-container';
          container.style.display = 'none';
          document.body.appendChild(container);
        } catch (e) {
          console.error('reCAPTCHA initialization error:', e);
        }
      }
    });
  </script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
